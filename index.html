<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER EPIC RECIEPT CLASIFIER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        font-family: monospace;
      }

      body {
        background: #fff0f6;
        color: #2a2a2a;
        line-height: 1.6;
        min-height: 100vh;
      }

      header {
        background: linear-gradient(135deg, #b00b69, #6c1a57);
        color: white;
        text-align: center;
        padding: 30px 20px;
      }

      h1 {
        font-size: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .subtitle {
        width: 100%;
        height: 250px;
        /* adjust as needed */
        background-image: url("ff32a73ae0afb925b2d802fbaf03b1e7.png");
        background-repeat: repeat-x;
        background-position: center top;
        background-size: auto 100%;
      }

      .input-section,
      .preview-section {
        padding: 20px;
        background: #fff;
        margin: 10px;
        border-radius: 10px;
      }

      textarea {
        width: 100%;
        height: 250px;
        padding: 12px;
        border: 2px solid #b00b69;
        border-radius: 8px;
        font-size: 14px;
        resize: vertical;
        box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.05);
      }

      textarea:focus {
        outline: none;
        border-color: #b00b69;
      }

      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 15px;
        flex-wrap: wrap;
      }

      button {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        color: white;
      }

      .btn-primary {
        background: #b00b69;
      }

      .btn-secondary {
        background: #6cb;
      }

      .btn-tertiary {
        background: #e74c3c;
      }

      button:hover {
        opacity: 0.9;
      }

      .table-container {
        margin-top: 20px;
        overflow-x: auto;
        background: white;
        border-radius: 10px;
        border: 1px solid #eee;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }

      th {
        background: #b00b69;
        color: white;
      }

      tr:hover {
        background-color: #fdf0f5;
      }

      .tax-select {
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid #ccc;
        font-size: 14px;
      }

      .tax-9 {
        background: #f6eaff;
        color: #6c1a57;
      }

      .tax-21 {
        background: #ffd6e8;
        color: #b00b69;
      }

      .tax-unknown {
        background: #fef3cd;
        color: #856404;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin: 20px 0;
      }

      .stat-card {
        background: #b00b69;
        color: white;
        padding: 15px;
        border-radius: 10px;
        flex: 1 1 200px;
        text-align: center;
      }

      .stat-card.high-tax {
        background: #e74c3c;
      }

      .stat-card.unclassified {
        background: #f39c12;
      }

      .stat-card.total {
        background: #6c1a57;
      }

      .stat-value {
        font-size: 1.5rem;
        font-weight: bold;
      }

      .stat-label {
        font-size: 0.85rem;
        opacity: 0.9;
        margin-top: 5px;
      }

      .loading {
        text-align: center;
        padding: 20px;
      }

      .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-top: 4px solid #b00b69;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      footer {
        text-align: center;
        padding: 20px;
        color: white;
        background: #6c1a57;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 1.6rem;
          flex-direction: column;
        }

        .stats {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>
        <span>:3</span>
        Jay's super epic receipt classifier that also spits out an excel sheet
        <span>:3</span>
      </h1>
      <p class="subtitle">yeah yeah</p>
    </header>

    <div class="content">
      <div class="input-section">
        <h2>Input text</h2>

        <textarea id="receiptData"
          placeholder="the text goes here it needs to be like 1 apple juice 2.50 2 chjeese burger 11.20 or smething like alternating"></textarea>

        <div class="button-group">
          <button class="btn-primary" onclick="parseReceipt()">
            <span>🫩</span> Process Receipt
          </button>
          <button class="btn-tertiary" onclick="clearAll()">
            <span>🫩</span> Clear All
          </button>
        </div>

        <div class="preview-section">
          <h2>Processed Results</h2>

          <div class="button-group">
            <button class="btn-secondary" onclick="downloadExcel()" id="downloadBtn" disabled>
              <span>🫩</span> Download Excel
            </button>
          </div>

          <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>THIS IS A SUPER FANCY LOADING </p>
          </div>

          <div id="results"></div>
        </div>
      </div>

      <footer>
        <p>THE WEBSITE EXPLODED WHEN I DELETED THE FOOTER SO IT MUST STAY?</p>
      </footer>

  <script>
    // Global variable to store processed data
    let processedData = {
      items: [],
      totals: {
        lowTax: 0,
        highTax: 0,
        unclassified: 0,
        grandTotal: 0
      }
    };

    // Tax categories
    const LOW_TAX_KEYWORDS = [
      'friet', 'bitterballen', 'brood', 'dips', 'cheese', 'kroketjes', 'jus',
      'cola', 'tonic', 'chaudfontaine', 'espresso', 'water', 'sap', 'frisdrank',
      'koffie', 'thee', 'croquettes', 'beef', 'fries', 'bread', 'juice', 'soda',
      'coffee', 'tea', 'garnituur', 'snack', 'jus', 'coca', 'gingerbier',
    ];

    const HIGH_TAX_KEYWORDS = [
      'bier', 'wijn', 'rose', 'martini', 'amaretto', 'sour',
      'ipa', 'blonde', 'witbier', 'blond', 'kompaan', 'sauvignon',
      'aragonez', 'cocktail', 'alcohol', 'wine', 'beer', 'rental',
      'vino', 'tinto', 'blanco', 'rosado', 'cava', 'champagne',
      'liquor', 'spirit', 'whisky', 'gin', 'vodka', 'rum', 'tequila', 'pornstar',
      'espresso martini', 'amaretto sour', 'heineken', 'rose'
    ];
    
    function parseReceipt() {
      // Show loading indicator
      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').innerHTML = '';

      // Use setTimeout to allow UI to update before processing
      setTimeout(() => {
        const receiptData = document.getElementById('receiptData').value;
        const lines = receiptData.split('\n')
          .map(line => line.trim())
          .filter(line => line.length > 0);

        processLines(lines);

        // Hide loading indicator
        document.getElementById('loading').style.display = 'none';

        // Enable download button
        document.getElementById('downloadBtn').disabled = false;
      }, 100);
    }

    function processLines(lines) {
      // Reset data
      processedData = {
        items: [],
        totals: {
          lowTax: 0,
          highTax: 0,
          unclassified: 0,
          grandTotal: 0
        }
      };

      let currentItem = null;
      let itemCount = 1;

      for (const line of lines) {
        // Check if line is a price (numeric)
        if (isNumeric(line.replace(',', '.'))) {
          if (currentItem !== null) {
            const price = parseFloat(line.replace(',', '.'));
            currentItem.price = price;
            currentItem.priceText = line;
            categorizeItem(currentItem);
            processedData.items.push(currentItem);
            currentItem = null;
          }
        } else {
          // Handle item lines
          if (currentItem !== null) {
            // Save previous item with error
            currentItem.price = 0;
            currentItem.priceText = 'ERROR: Missing price';
            currentItem.error = true;
            categorizeItem(currentItem);
            processedData.items.push(currentItem);
          }
          
          // Extract quantity if present
          const quantityMatch = line.match(/^(\d+)\s+/);
          let name = line;
          let quantity = 1;
          
          if (quantityMatch) {
            quantity = parseInt(quantityMatch[1]);
            name = line.substring(quantityMatch[0].length).trim();
          }
          
          currentItem = {
            id: itemCount++,
            name: name,
            quantity: quantity,
            price: null,
            priceText: '',
            taxRate: null,
            taxCategory: null,
            error: false
          };
        }
      }

      // Handle last item if exists
      if (currentItem !== null) {
        currentItem.price = 0;
        currentItem.priceText = 'ERROR: Missing price';
        currentItem.error = true;
        categorizeItem(currentItem);
        processedData.items.push(currentItem);
      }

      // Calculate totals
      recalculateTotals();

      // Display results
      displayResults();
    }

    function categorizeItem(item) {
      const name = item.name.toLowerCase();

      // Check for low tax keywords
      if (LOW_TAX_KEYWORDS.some(kw => name.includes(kw))) {
        item.taxRate = 9;
        item.taxCategory = 'low';
        return;
      }
      
      // Check for high tax keywords
      if (HIGH_TAX_KEYWORDS.some(kw => name.includes(kw))) {
        item.taxRate = 21;
        item.taxCategory = 'high';
        return;
      }
      
      // Special cases
      if (name.includes('0.0%') || name.includes('0.5%') || name.includes('non-alc')) {
        item.taxRate = 9;
        item.taxCategory = 'low';
        return;
      }
      
      if (name.includes('alcohol') || name.includes('wine') || name.includes('beer') || name.includes('alc')) {
        item.taxRate = 21;
        item.taxCategory = 'high';
        return;
      }
      
      // Unclassified
      item.taxRate = 'Unknown';
      item.taxCategory = 'unclassified';
    }

    function recalculateTotals() {
      processedData.totals.lowTax = processedData.items
        .filter(item => item.taxCategory === 'low' && !item.error)
        .reduce((sum, item) => sum + (item.price), 0);

      processedData.totals.highTax = processedData.items
        .filter(item => item.taxCategory === 'high' && !item.error)
        .reduce((sum, item) => sum + (item.price), 0);

      processedData.totals.unclassified = processedData.items
        .filter(item => item.taxCategory === 'unclassified' && !item.error)
        .reduce((sum, item) => sum + (item.price), 0);

      processedData.totals.grandTotal = processedData.totals.lowTax +
        processedData.totals.highTax +
        processedData.totals.unclassified;
    }

    function isNumeric(str) {
      return /^-?\d+(?:[.,]\d+)?$/.test(str);
    }

    function displayResults() {
      const resultsDiv = document.getElementById('results');
      let html = '';

      // Get counts for each category
      const lowTaxCount = processedData.items.filter(i => i.taxCategory === 'low').length;
      const highTaxCount = processedData.items.filter(i => i.taxCategory === 'high').length;
      const unclassifiedCount = processedData.items.filter(i => i.taxCategory === 'unclassified').length;

      // Display statistics
      html += `
        <div class="stats">
          <div class="stat-card">
            <div class="stat-value">${lowTaxCount}</div>
            <div class="stat-label">9% BTW Items</div>
            <div class="stat-value">€${processedData.totals.lowTax.toFixed(2)}</div>
          </div>
          <div class="stat-card high-tax">
            <div class="stat-value">${highTaxCount}</div>
            <div class="stat-label">21% BTW Items</div>
            <div class="stat-value">€${processedData.totals.highTax.toFixed(2)}</div>
          </div>
          <div class="stat-card unclassified">
            <div class="stat-value">${unclassifiedCount}</div>
            <div class="stat-label">Unclassified Items</div>
            <div class="stat-value">€${processedData.totals.unclassified.toFixed(2)}</div>
          </div>
          <div class="stat-card total">
            <div class="stat-value">${processedData.items.length}</div>
            <div class="stat-label">Total Items</div>
            <div class="stat-value">€${processedData.totals.grandTotal.toFixed(2)}</div>
          </div>
        </div>
      `;

      // Display success message
      html += `
        <div class="success">
          <strong>Success!</strong> Processed ${processedData.items.length} items. 
          Found ${lowTaxCount} items at 9% BTW (€${processedData.totals.lowTax.toFixed(2)}), 
          ${highTaxCount} items at 21% BTW (€${processedData.totals.highTax.toFixed(2)}), 
          and ${unclassifiedCount} unclassified items (€${processedData.totals.unclassified.toFixed(2)}).
        </div>
      `;

      // Display editable table
      html += `
        <div class="info">
          <strong>Edit Prices:</strong> You can manually adjust prices below before exporting to Excel
        </div>
        
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Item</th>
                <th>Qty</th>
                <th>Price (Total)</th>
                <th>Tax Rate</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${processedData.items.map((item, index) => `
                <tr>
                  <td>${item.id}</td>
                  <td>${item.name}</td>
                  <td>${item.quantity}</td>
                  <td>
                    <input type="number" step="0.01" class="price-input ${item.error ? 'error' : ''}" 
                      value="${item.price}" 
                      onchange="updatePrice(${index}, this.value)"
                      id="price-input-${index}">
                  </td>
                  <td>
                    <select class="tax-select tax-${item.taxRate}" 
                      onchange="updateTaxRate(${index}, this.value)" 
                      id="tax-select-${index}">
                      <option value="9" ${item.taxRate === 9 ? 'selected' : ''}>9%</option>
                      <option value="21" ${item.taxRate === 21 ? 'selected' : ''}>21%</option>
                      <option value="Unknown" ${item.taxRate === 'Unknown' ? 'selected' : ''}>Unclassified</option>
                    </select>
                  </td>
                  <td>
                    <span class="status ${item.error ? 'status-error' : item.taxRate === 'Unknown' ? 'status-review' : 'status-ok'}">
                      ${item.error ? '⚠️ Missing price' : item.taxRate === 'Unknown' ? '⚠️ Review needed' : '✅ Classified'}
                    </span>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      resultsDiv.innerHTML = html;
    }

    function updatePrice(index, newPrice) {
      const item = processedData.items[index];
      const parsedPrice = parseFloat(newPrice);
      
      if (isNaN(parsedPrice)) {
        // Invalid price
        item.error = true;
        item.price = 0;
        
        // Update input style
        const priceInput = document.getElementById(`price-input-${index}`);
        if (priceInput) {
          priceInput.classList.add('error');
        }
      } else {
        // Valid price
        item.error = false;
        item.price = parsedPrice;
        
        // Update input style
        const priceInput = document.getElementById(`price-input-${index}`);
        if (priceInput) {
          priceInput.classList.remove('error');
        }
      }
      
      // Update status
      const statusCell = document.querySelector(`#price-input-${index}`)?.closest('tr')?.cells[5];
      if (statusCell) {
        statusCell.innerHTML = `
          <span class="status ${item.error ? 'status-error' : item.taxRate === 'Unknown' ? 'status-review' : 'status-ok'}">
            ${item.error ? '⚠️ Missing price' : item.taxRate === 'Unknown' ? '⚠️ Review needed' : '✅ Classified'}
          </span>
        `;
      }
      
      // Recalculate and update totals
      recalculateTotals();
      updateTotalsDisplay();
    }

    function updateTaxRate(index, newRate) {
      const item = processedData.items[index];
      
      // Update tax rate and category
      if (newRate === '9') {
        item.taxRate = 9;
        item.taxCategory = 'low';
      } else if (newRate === '21') {
        item.taxRate = 21;
        item.taxCategory = 'high';
      } else {
        item.taxRate = 'Unknown';
        item.taxCategory = 'unclassified';
      }
      
      // Update styling of select element
      const select = document.getElementById(`tax-select-${index}`);
      if (select) {
        select.className = `tax-select tax-${item.taxRate}`;
      }
      
      // Update status
      const statusCell = document.querySelector(`#tax-select-${index}`)?.closest('tr')?.cells[5];
      if (statusCell) {
        statusCell.innerHTML = `
          <span class="status ${item.error ? 'status-error' : item.taxRate === 'Unknown' ? 'status-review' : 'status-ok'}">
            ${item.error ? '⚠️ Missing price' : item.taxRate === 'Unknown' ? '⚠️ Review needed' : '✅ Classified'}
          </span>
        `;
      }
      
      // Recalculate and update totals
      recalculateTotals();
      updateTotalsDisplay();
    }

    function updateTotalsDisplay() {
      // Get counts for each category
      const lowTaxCount = processedData.items.filter(i => i.taxCategory === 'low').length;
      const highTaxCount = processedData.items.filter(i => i.taxCategory === 'high').length;
      const unclassifiedCount = processedData.items.filter(i => i.taxCategory === 'unclassified').length;

      // Update the statistics cards
      if (document.querySelectorAll('.stat-card').length > 0) {
        document.querySelectorAll('.stat-card')[0].querySelectorAll('.stat-value')[0].textContent = lowTaxCount;
        document.querySelectorAll('.stat-card')[0].querySelectorAll('.stat-value')[1].textContent = '€' + processedData.totals.lowTax.toFixed(2);
        
        document.querySelectorAll('.stat-card')[1].querySelectorAll('.stat-value')[0].textContent = highTaxCount;
        document.querySelectorAll('.stat-card')[1].querySelectorAll('.stat-value')[1].textContent = '€' + processedData.totals.highTax.toFixed(2);
        
        document.querySelectorAll('.stat-card')[2].querySelectorAll('.stat-value')[0].textContent = unclassifiedCount;
        document.querySelectorAll('.stat-card')[2].querySelectorAll('.stat-value')[1].textContent = '€' + processedData.totals.unclassified.toFixed(2);
        
        document.querySelectorAll('.stat-card')[3].querySelectorAll('.stat-value')[0].textContent = processedData.items.length;
        document.querySelectorAll('.stat-card')[3].querySelectorAll('.stat-value')[1].textContent = '€' + processedData.totals.grandTotal.toFixed(2);
      }

      // Update success message
      const successElement = document.querySelector('.success');
      if (successElement) {
        successElement.innerHTML = `
          <strong>Success!</strong> Processed ${processedData.items.length} items. 
          Found ${lowTaxCount} items at 9% BTW (€${processedData.totals.lowTax.toFixed(2)}), 
          ${highTaxCount} items at 21% BTW (€${processedData.totals.highTax.toFixed(2)}), 
          and ${unclassifiedCount} unclassified items (€${processedData.totals.unclassified.toFixed(2)}).
        `;
      }
    }

    function downloadExcel() {
      // Create workbook
      const wb = XLSX.utils.book_new();

      // Create main sheet with all items - UPDATED: Removed "Price" column, renamed "Total" to "Price", removed tax columns, added unclassified amount
      const mainData = [
        ['ID', 'Item', 'Quantity', 'Price', 'Low Tax Amount', 'High Tax Amount', 'Unclassified Tax Amount']
      ];

      processedData.items.forEach(item => {
        // Calculate tax amounts
        const totalAmount = item.price;
        const lowTaxAmount = item.taxCategory === 'low' ? totalAmount : '';
        const highTaxAmount = item.taxCategory === 'high' ? totalAmount : '';
        const unclassifiedTaxAmount = item.taxCategory === 'unclassified' ? totalAmount : '';
        
        mainData.push([
          item.id,
          item.name,
          item.quantity,
          totalAmount.toFixed(2), // This is now the "Price" column (previously "Total")
          lowTaxAmount,
          highTaxAmount,
          unclassifiedTaxAmount
        ]);
      });

      // Add totals row
      mainData.push([
        '',
        'TOTALS',
        '',
        processedData.totals.grandTotal.toFixed(2),
        processedData.totals.lowTax.toFixed(2),
        processedData.totals.highTax.toFixed(2),
        processedData.totals.unclassified.toFixed(2)
      ]);

      const mainWs = XLSX.utils.aoa_to_sheet(mainData);
      XLSX.utils.book_append_sheet(wb, mainWs, "Receipt Items");

      // Create summary sheet
      const summaryData = [
        ['Category', 'Item Count', 'Total Value (€)'],
        ['9% BTW',
          processedData.items.filter(i => i.taxCategory === 'low').length,
          processedData.totals.lowTax.toFixed(2)
        ],
        ['21% BTW',
          processedData.items.filter(i => i.taxCategory === 'high').length,
          processedData.totals.highTax.toFixed(2)
        ],
        ['Unclassified',
          processedData.items.filter(i => i.taxCategory === 'unclassified').length,
          processedData.totals.unclassified.toFixed(2)
        ],
        ['GRAND TOTAL',
          processedData.items.length,
          processedData.totals.grandTotal.toFixed(2)
        ]
      ];

      const summaryWs = XLSX.utils.aoa_to_sheet(summaryData);
      XLSX.utils.book_append_sheet(wb, summaryWs, "Summary");

      // Generate file and download
      const wbout = XLSX.write(wb, {bookType: 'xlsx', type: 'binary'});
      function s2ab(s) {
        const buf = new ArrayBuffer(s.length);
        const view = new Uint8Array(buf);
        for (let i = 0; i < s.length; i++) view[i] = s.charCodeAt(i) & 0xFF;
        return buf;
      }

      const filename = "receipt_export.xlsx";
      saveAs(new Blob([s2ab(wbout)], {type: "application/octet-stream"}), filename);

      // Show success message
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML += `
        <div class="success">
          <strong>Excel file downloaded successfully!</strong> File name: ${filename}
          <div style="margin-top:10px">The Excel file contains separate columns for Low Tax and High Tax amounts.</div>
        </div>
      `;
    }

    function clearAll() {
      document.getElementById('receiptData').value = '';
      document.getElementById('results').innerHTML = '';
      document.getElementById('downloadBtn').disabled = true;
      processedData = {
        items: [],
        totals: {
          lowTax: 0,
          highTax: 0,
          unclassified: 0,
          grandTotal: 0
        }
      };
    }
  </script>
</body>
</html>
